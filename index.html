<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>대한검정회 5급 한자 학습</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Noto Sans KR', sans-serif; background: #f9f9f7; color: #1a1a1a; min-height: 100vh; }
.hero { padding: 3rem 1.5rem 2rem; text-align: center; }
.hero-badge { display: inline-block; background: #e6f1fb; color: #185fa5; font-size: 12px; font-weight: 500; padding: 4px 14px; border-radius: 20px; margin-bottom: 1rem; }
.hero-title { font-size: 26px; font-weight: 500; color: #1a1a1a; margin-bottom: 8px; }
.hero-sub { font-size: 14px; color: #888; line-height: 1.6; }
.complete-notice { max-width: 480px; margin: 0 auto 1.5rem; padding: 0 1.5rem; }
.complete-box { background: linear-gradient(135deg,#e6f1fb,#edf5e0); border-radius: 12px; padding: 1rem 1.25rem; font-size: 13px; color: #2a5a20; text-align: center; border: 0.5px solid #c8e0b8; }
.progress-section { max-width: 480px; margin: 0 auto 2.5rem; padding: 0 1.5rem; }
.prog-label-row { display: flex; justify-content: space-between; margin-bottom: 6px; }
.prog-label-text { font-size: 13px; color: #555; }
.prog-label-count { font-size: 13px; color: #888; }
.prog-track { height: 6px; background: #e0e0dc; border-radius: 3px; overflow: hidden; }
.prog-bar { height: 100%; border-radius: 3px; background: linear-gradient(90deg,#378add,#7f77dd,#ef9f27,#1d9e75,#d85a30,#d4537e,#639922,#185fa5); }
.stages { max-width: 520px; margin: 0 auto; padding: 0 1.5rem 4rem; display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.stage-card { border-radius: 14px; padding: 1.25rem 1.25rem 1rem; text-decoration: none; display: flex; flex-direction: column; gap: 10px; transition: transform 0.15s, box-shadow 0.15s; position: relative; overflow: hidden; background: #fff; border: 0.5px solid #e0e0dc; }
.stage-card:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.08); }
.stage-num { font-size: 11px; font-weight: 500; color: #aaa; }
.stage-title { font-size: 15px; font-weight: 500; color: #1a1a1a; }
.stage-chars { font-size: 17px; font-family: serif; letter-spacing: 2px; line-height: 1.6; color: #444; }
.stage-footer { display: flex; align-items: center; justify-content: space-between; }
.stage-count { font-size: 11px; color: #aaa; }
.stage-color-bar { position: absolute; top: 0; left: 0; right: 0; height: 3px; border-radius: 14px 14px 0 0; }
@media (prefers-color-scheme: dark) {
  body { background: #1a1a1a; color: #f0f0ec; }
  .hero-title { color: #f0f0ec; }
  .prog-label-text { color: #aaa; }
  .stage-card { background: #2a2a28; border-color: #3a3a38; }
  .stage-card:hover { box-shadow: 0 6px 20px rgba(0,0,0,0.3); }
  .stage-title { color: #f0f0ec; }
  .stage-chars { color: #aaa; }
  .prog-track { background: #3a3a38; }
  .complete-box { background: linear-gradient(135deg,#0c2a50,#1a3005); color: #90d060; border-color: #1a3a1a; }
}
</style>
</head>
<body>
<div class="hero">
  <div class="hero-badge">카이카이 한자</div>
  <div class="hero-title">대한 검정회 5급 한자 학습</div>
  <div class="hero-sub">단계를 선택해서 공부를 시작해요!<br>한자 학습 → 한자어 → 퀴즈 → 테스트 순서로 해보세요 😊</div>
</div>

<div class="complete-notice">
  <div class="complete-box">🎉 8단계 전체 완성! 5급 한자 80자를 모두 학습할 수 있어요!</div>
</div>

<div class="progress-section">
  <div class="prog-label-row">
    <span class="prog-label-text">전체 진도</span>
    <span class="prog-label-count">8 / 8 단계 완성</span>
  </div>
  <div class="prog-track">
    <div class="prog-bar" style="width:100%"></div>
  </div>
</div>

<div class="stages" id="stages-grid"></div>

<script>
const STAGES=[
  {dan:1,chars:'春夏秋冬花風友各部限',file:'hanja_5gup_1dan_final.html',color:'#378add'},
  {dan:2,chars:'太去信便成當親高才對',file:'hanja_5gup_2dan_final.html',color:'#7f77dd'},
  {dan:3,chars:'性形活短示朝社毛重樂',file:'hanja_5gup_3dan_final.html',color:'#ef9f27'},
  {dan:4,chars:'功見行會作弱血放神新',file:'hanja_5gup_4dan_final.html',color:'#1d9e75'},
  {dan:5,chars:'命死村急晝田理和竹運',file:'hanja_5gup_5dan_final.html',color:'#d85a30'},
  {dan:6,chars:'明無又線意直銀步强用',file:'hanja_5gup_6dan_final.html',color:'#d4537e'},
  {dan:7,chars:'共貝米肉半讀書詩禮科',file:'hanja_5gup_7dan_final.html',color:'#639922'},
  {dan:8,chars:'身旗英聞夜通番頭等班',file:'hanja_5gup_8dan_final.html',color:'#185fa5'},
];
function buildStages(){
  const grid=document.getElementById('stages-grid');
  STAGES.forEach(s=>{
    const card=document.createElement('a');
    card.className='stage-card';
    card.href=s.file;
    const bar=document.createElement('div');bar.className='stage-color-bar';bar.style.background=s.color;
    const num=document.createElement('div');num.className='stage-num';num.textContent=s.dan+'단계';
    const title=document.createElement('div');title.className='stage-title';title.textContent='학습하기';
    const chars=document.createElement('div');chars.className='stage-chars';chars.textContent=s.chars.split('').join(' ');
    const footer=document.createElement('div');footer.className='stage-footer';
    const count=document.createElement('span');count.className='stage-count';count.textContent='10자 · 4가지 활동';
    const arrow=document.createElement('span');arrow.textContent='→';arrow.style.color='#bbb';
    footer.appendChild(count);footer.appendChild(arrow);
    card.appendChild(bar);card.appendChild(num);card.appendChild(title);card.appendChild(chars);card.appendChild(footer);
    grid.appendChild(card);
  });
}
buildStages();
</script>
</body>
</html>
